name: Ses örneği (TTS)
on:
  push:
    paths: ["data/ses_dene/tetik.txt"]
  workflow_dispatch:
concurrency: { group: repo-write, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q piper-tts
      - name: Türkçe sesleri indir
        run: |
          mkdir -p voices
          for v in dfki fahrettin fettah; do
            for ext in onnx onnx.json; do
              curl -sfL -o voices/tr_TR-$v-medium.$ext "https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/tr_TR/$v/medium/tr_TR-$v-medium.$ext" || echo "indirilemedi $v $ext"
            done
          done
          ls -la voices
      - run: python tools/tts_sample.py tr_TR-dfki-medium tr_TR-fahrettin-medium tr_TR-fettah-medium
      - run: |
          git config user.name "roadcraft-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/ses_dene; git diff --cached --quiet || git commit -m "TTS örnekleri"
          git pull --rebase -q && git push -q
